name: Update AU TVBox Sources

on:
  schedule:
    - cron: '0 4,16 * * *'  # Runs automatically at 04:00 and 16:00 UTC daily
  workflow_dispatch:        # Allows manual 1-click trigger in GitHub Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Cleaner Pipeline
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python cleaner.py

      - name: Commit Updated Sources to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || (git commit -m "chore(sources): auto-update cleaned sources [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
